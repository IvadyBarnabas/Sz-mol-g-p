<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Számológép</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="main.js"></script>
</head>
<body>
    <main>
        <header>
            <h1>Számológép</h1>
        </header>
        <div>
            <input type="text" id="kijelzo">
        </div>
        <article>
            <button class="szamok">7</button>
            <button class="szamok">8</button>
            <button class="szamok">9</button>
            <button id="/" class="muveletek">/</button>
            <button class="szamok">4</button>
            <button class="szamok">5</button>
            <button class="szamok">6</button>
            <button id="*" class="muveletek">*</button>
            <button class="szamok">1</button>
            <button class="szamok">2</button>
            <button class="szamok">3</button>
            <button id="-" class="muveletek">-</button>
            <button id="torles">C</button>
            <button class="szamok">0</button>
            <button id="egyenlo">=</button>
            <button id="+" class="muveletek">+</button>
        </article>
    </main>
</body>
</html>
